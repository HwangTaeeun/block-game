<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동 날개새</title><link rel="stylesheet" href="../common.css"></head>
<body>
<canvas id="c"></canvas>
<div class="note">새가 알아서 파이프 사이를 통과합니다. 절대 안 부딪혀요.</div>
<script src="../common.js"></script>
<script>
const bar = mountBar('자동 날개새');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 320, H = 480, GROUND = H - 40, PW = 52, GAP = 150, SPACING = 170, R = 12, BX = 80;
cv.width = W; cv.height = H;
let bird = { y: H / 2, vy: 0 }, pipes = [], cd = 0, jit = 0, score = 0, best = 0, off = 0, flapAnim = 0;

function addPipe(x) { pipes.push({ x, gapY: rnd(110, GROUND - 110), passed: false }); }
for (let i = 0; i < 3; i++) addPipe(W + 100 + i * SPACING);

function flap() { bird.vy = -6.2; cd = 8; jit = rnd(-8, 8); flapAnim = 6; Snd.tone(420, 0.09, 'square', 0.07, 760); }
function step() {
  off = (off + 2.4) % 24;
  for (const p of pipes) p.x -= 2.4;
  if (pipes[0].x + PW < -10) pipes.shift();
  if (pipes[pipes.length - 1].x < W - SPACING + 40) addPipe(pipes[pipes.length - 1].x + SPACING);

  const next = pipes.find(p => p.x + PW > BX - R);
  const target = (next ? next.gapY : H / 2) + 12 + jit;
  cd--;
  if (bird.y > target && bird.vy > -1 && cd <= 0) flap();
  bird.vy = Math.min(bird.vy + 0.4, 9); bird.y += bird.vy;
  if (flapAnim > 0) flapAnim--;

  for (const p of pipes) {
    if (BX + R > p.x && BX - R < p.x + PW && (bird.y - R < p.gapY - GAP / 2 || bird.y + R > p.gapY + GAP / 2)) { bird.y = p.gapY; bird.vy = 0; }  // 안전장치: 절대 안 죽음
    if (!p.passed && p.x + PW < BX - R) { p.passed = true; score++; best = Math.max(best, score); Snd.tone(880, 0.1, 'triangle', 0.1, 1320); }
  }
  bird.y = clamp(bird.y, R, GROUND - R);
}
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4ec0ca'); g.addColorStop(1, '#bfe9ee');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const p of pipes) {
    ctx.fillStyle = '#73bf2e'; ctx.strokeStyle = '#2d5a12'; ctx.lineWidth = 3;
    for (const [y, h] of [[0, p.gapY - GAP / 2], [p.gapY + GAP / 2, GROUND - p.gapY - GAP / 2]]) { ctx.fillRect(p.x, y, PW, h); ctx.strokeRect(p.x, y, PW, h); }
    ctx.fillStyle = '#86d63a'; ctx.fillRect(p.x - 4, p.gapY - GAP / 2 - 22, PW + 8, 22); ctx.strokeRect(p.x - 4, p.gapY - GAP / 2 - 22, PW + 8, 22);
    ctx.fillRect(p.x - 4, p.gapY + GAP / 2, PW + 8, 22); ctx.strokeRect(p.x - 4, p.gapY + GAP / 2, PW + 8, 22);
  }
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#73bf2e'; for (let x = -off; x < W; x += 24) ctx.fillRect(x, GROUND, 12, 8);
  ctx.save(); ctx.translate(BX, bird.y); ctx.rotate(clamp(bird.vy / 12, -0.5, 1));
  ctx.fillStyle = '#f7d51d'; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -4, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(6, -4, 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#f27b21'; ctx.fillRect(R - 3, 0, 9, 5);
  ctx.fillStyle = '#e8a817'; ctx.beginPath(); ctx.ellipse(-4, 3 + (flapAnim ? -4 : 0), 6, 4, 0, 0, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.font = 'bold 40px system-ui'; ctx.textAlign = 'center';
  ctx.strokeText(score, W / 2, 60); ctx.fillText(score, W / 2, 60);
}
loop(step, draw, () => 60 * bar.mult());
</script></body></html>
